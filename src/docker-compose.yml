services:
  backend:
    image: ${IMAGE_REGISTRY}/${NEXUS_REPO_BACKEND}/sandbox-backend:${IMAGE_TAG}
    container_name: my_backend
    restart: always
    ports:
      - "${BACKEND_PORT}:8081"
    env_file:
      - .env

  frontend:
    image: ${IMAGE_REGISTRY}/${NEXUS_REPO_FRONTEND}/sandbox-frontend:${IMAGE_TAG}
    container_name: my_frontend
    restart: always
    ports:
      - "${FRONTEND_PORT}:8080"
    depends_on:
      - backend
    env_file:
      - .env