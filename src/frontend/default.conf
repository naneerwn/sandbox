server {
  listen 8080;

  location / {
    root /app/frontend/;
    index index.html;
  }

  location /products {
    proxy_pass http://momo-store-backend:8081/products;
  }
  location /categories {
    proxy_pass http://momo-store-backend:8081/categories;
  }
  location /auth/whoami {
    proxy_pass http://momo-store-backend:8081/auth/whoami;
  }
  location /orders {
    proxy_pass http://momo-store-backend:8081/orders;
  }
}
