name: build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    container:
      image: docker:24.0.5-cli
    env:
      DOCKER_API_VERSION: "1.44"
      NEXUS_USER: ${{ secrets.NEXUS_USER }}
      NEXUS_PASS: ${{ secrets.NEXUS_PASS }}
      NEXUS_HOST: ${{ secrets.NEXUS_HOST }}
      NEXUS_REPO_BACKEND: ${{ secrets.NEXUS_REPO_BACKEND }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure .env exists
        run: touch .env

      - name: Build backend
        run: |
          chmod +x ./build-backend.sh
          sh ./build-backend.sh

  build-frontend:
    runs-on: ubuntu-latest
    container:
      image: docker:24.0.5-cli
    env:
      DOCKER_API_VERSION: "1.44"
      NEXUS_USER: ${{ secrets.NEXUS_USER }}
      NEXUS_PASS: ${{ secrets.NEXUS_PASS }}
      NEXUS_HOST: ${{ secrets.NEXUS_HOST }}
      NEXUS_REPO_FRONTEND: ${{ secrets.NEXUS_REPO_FRONTEND }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure .env exists
        run: touch .env

      - name: Build frontend
        run: |
          chmod +x ./build-frontend.sh
          sh ./build-frontend.sh