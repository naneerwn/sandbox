name: CD Pipeline

on:
  push:
    branches: [ "**" ] # <-- ВОТ ЭТО ДОБАВЛЕНО: запуск при любом пуше в любую ветку
  workflow_dispatch: # Оставляем для ручного запуска (отката)
    inputs:
      version:
        description: 'Версия для деплоя (тег образа). Оставьте пустым для latest'
        required: false
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.12.0'

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy via Helm
        run: |
          # Если это ручной запуск, берем версию из инпута. 
          # Если это пуш — ставим latest (или можно подставить github.sha)
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="latest"
          fi
          
          echo "Deploying version: $VERSION"
          
          helm upgrade --install my-release ./helm/sandbox \
            --namespace sandbox \
            --create-namespace \
            --set version="$VERSION"