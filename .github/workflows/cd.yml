name: CD

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия для деплоя'
        required: true
        default: 'latest'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Yandex Cloud CLI
        run: |
          curl -sSL https://yandexcloud.net | bash -s -- -i /usr/local/yandex-cloud -n
          sudo ln -sf /usr/local/yandex-cloud/bin/yc /usr/local/bin/yc

      - name: Configure yc
        env:
          YC_SA_KEY: ${{ secrets.YC_SA_KEY }}
          YC_FOLDER_ID: ${{ vars.YC_FOLDER_ID }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/yc-sa-key.json"
          printf '%s' "$YC_SA_KEY" > "$RUNNER_TEMP/yc-sa-key.json"

          yc config profile create ci
          yc config set service-account-key "$RUNNER_TEMP/yc-sa-key.json"
          yc config set folder-id "$YC_FOLDER_ID"

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Configure kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p ~/.kube
          printf '%s\n' "$KUBE_CONFIG" > ~/.kube/config
          sed -i 's|/home/v-kash/yandex-cloud/bin/yc|/usr/local/bin/yc|g' ~/.kube/config
          sed -i 's|--profile=default|--profile=ci|g' ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy with Helm
        run: |
          helm upgrade --install sandbox ./helm/sandbox \
            --namespace sandbox \
            --create-namespace \
            --set version="${{ github.event.inputs.version }}"
