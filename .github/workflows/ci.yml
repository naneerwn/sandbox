name: CI Pipeline

on:
  push:
    branches: [ "**" ]
  # workflow_dispatch:
  #   inputs:
  #     VERSION:
  #       required: false
  #       type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. ДЖОБА ВЕРСИИ
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Generate VERSION
        id: version
        run: |
          if [ -n "${{ github.event.inputs.VERSION }}" ]; then
            echo "version=${{ github.event.inputs.VERSION }}" >> $GITHUB_OUTPUT
          else
            echo "version=$(date -u +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT
          fi

  # 2. МОДУЛЬНЫЕ ТЕСТЫ
  test:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      
      - name: Run Go tests and generate reports
        working-directory: src/backend
        run: |
          mkdir -p ${{ github.workspace }}/reports
          set -e
          go install github.com/jstemmer/go-junit-report/v2@v2.1.0
          set +e
          CGO_ENABLED=0 go test -v -coverprofile=${{ github.workspace }}/reports/coverage.out ./... > ${{ github.workspace }}/reports/test.log 2>&1
          rc=$?
          set -e
          "$(go env GOPATH)/bin/go-junit-report" < ${{ github.workspace }}/reports/test.log > ${{ github.workspace }}/reports/junit.xml
          [ -f ${{ github.workspace }}/reports/coverage.out ] && go tool cover -func=${{ github.workspace }}/reports/coverage.out > ${{ github.workspace }}/reports/coverage.txt || true
          exit $rc

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: ${{ github.workspace }}/reports/

  # 3. СБОРКА И ПУШ В GHCR
  build:
    needs: [version, test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/sandbox-${{ matrix.component }}
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./src/${{ matrix.component }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

