name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]

# Разрешаем пушить образы в GHCR (GitHub Container Registry)
permissions:
  contents: read
  packages: write

jobs:
  # --- 1. ТЕСТЫ БЭКЕНДА ---
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Go for tests
        uses: actions/setup-go@v5
        with:
          go-version: '1.22' # Сверь с версией в твоем go.mod
          
      - name: Run Tests
        working-directory: src/backend
        run: go test ./...

  # --- 2. СБОРКА И ПУШ БЭКЕНДА ---
  build-backend:
    needs: test-backend # Запустится только если тесты пройдут
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # Разрешаем Docker работать с Nexus по HTTP (без HTTPS)
      - name: Configure Docker
        run: |
          echo '{"insecure-registries":["${{ secrets.NEXUS_HOST }}"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      # Создаем пустой .env, чтобы скрипт сборки не упал с ошибкой
      - name: Ensure .env exists
        working-directory: src
        run: touch .env

      - name: Build and Push
        working-directory: src
        env:
          NEXUS_USER: ${{ secrets.NEXUS_USER }}
          NEXUS_PASS: ${{ secrets.NEXUS_PASS }}
          NEXUS_HOST: ${{ secrets.NEXUS_HOST }}
          NEXUS_REPO_BACKEND: ${{ secrets.NEXUS_REPO_BACKEND }}
        run: |
          chmod +x ./build-backend.sh
          bash ./build-backend.sh
          
          # Логин в GHCR
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          
          # Тегируем образ для GHCR и Nexus (с версией SHA и latest)
          docker tag my-backend:latest ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
          docker tag my-backend:latest ghcr.io/${{ github.repository }}/backend:latest
          docker tag my-backend:latest ${{ secrets.NEXUS_HOST }}/${{ secrets.NEXUS_REPO_BACKEND }}/my-backend:${{ github.sha }}
          
          # Пушим образы
          docker push ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}/backend:latest
          docker push ${{ secrets.NEXUS_HOST }}/${{ secrets.NEXUS_REPO_BACKEND }}/my-backend:${{ github.sha }}

  # --- 3. СБОРКА И ПУШ ФРОНТЕНДА ---
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure Docker
        run: |
          echo '{"insecure-registries":["${{ secrets.NEXUS_HOST }}"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: Ensure .env exists
        working-directory: src
        run: touch .env

      - name: Build and Push
        working-directory: src
        env:
          NEXUS_USER: ${{ secrets.NEXUS_USER }}
          NEXUS_PASS: ${{ secrets.NEXUS_PASS }}
          NEXUS_HOST: ${{ secrets.NEXUS_HOST }}
          NEXUS_REPO_FRONTEND: ${{ secrets.NEXUS_REPO_FRONTEND }}
        run: |
          chmod +x ./build-frontend.sh
          bash ./build-frontend.sh
          
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          
          docker tag my-frontend:latest ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
          docker tag my-frontend:latest ghcr.io/${{ github.repository }}/frontend:latest
          docker tag my-frontend:latest ${{ secrets.NEXUS_HOST }}/${{ secrets.NEXUS_REPO_FRONTEND }}/my-frontend:${{ github.sha }}
          
          docker push ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}/frontend:latest
          docker push ${{ secrets.NEXUS_HOST }}/${{ secrets.NEXUS_REPO_FRONTEND }}/my-frontend:${{ github.sha }}

  # --- 4. ДЕПЛОЙ НА СЕРВЕР ---
  deploy:
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Копируем docker-compose.yml на сервер в папку ~/app
      - name: Copy compose file to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "src/docker-compose.yml"
          target: "~/app/"
          strip_components: 1

      # Подключаемся по SSH и перезапускаем контейнеры
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ~/app
            
            # Создаем .env для compose с переменными портами
            echo "NEXUS_HOST=${{ secrets.NEXUS_HOST }}" > .env
            echo "NEXUS_REPO_BACKEND=${{ secrets.NEXUS_REPO_BACKEND }}" >> .env
            echo "NEXUS_REPO_FRONTEND=${{ secrets.NEXUS_REPO_FRONTEND }}" >> .env
            echo "BACKEND_PORT=8081" >> .env
            echo "FRONTEND_PORT=80" >> .env
            
            # Логин в Nexus
            echo "${{ secrets.NEXUS_PASS }}" | docker login -u "${{ secrets.NEXUS_USER }}" --password-stdin "${{ secrets.NEXUS_HOST }}"
            
            # 1. ЖЕСТКОЕ УДАЛЕНИЕ старых контейнеров (игнорируем ошибку, если их нет)
            docker rm -f my_backend my_frontend || true
            
            # 2. Остановка текущего проекта compose
            docker compose down --remove-orphans || true
            
            # 3. Скачиваем свежие образы и запускаем
            docker compose pull
            docker compose up -d