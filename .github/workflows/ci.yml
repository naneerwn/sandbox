name: build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    env:
      DOCKER_API_VERSION: "1.44"
      NEXUS_USER: ${{ secrets.NEXUS_USER }}
      NEXUS_PASS: ${{ secrets.NEXUS_PASS }}
      NEXUS_HOST: ${{ secrets.NEXUS_HOST }}
      NEXUS_REPO_BACKEND: ${{ secrets.NEXUS_REPO_BACKEND }}
      BACKEND_PORT: ${{ secrets.BACKEND_PORT }}
      FRONTEND_PORT: ${{ secrets.FRONTEND_PORT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure insecure registry
        run: |
          echo "{ \"insecure-registries\": [\"$NEXUS_HOST\"] }" | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
      - name: Ensure .env exists
        working-directory: src
        run: touch .env

      - name: Build backend
        working-directory: src
        run: |
          chmod +x ./build-backend.sh
          bash ./build-backend.sh
  build-frontend:
    runs-on: ubuntu-latest
    env:
      DOCKER_API_VERSION: "1.44"
      NEXUS_USER: ${{ secrets.NEXUS_USER }}
      NEXUS_PASS: ${{ secrets.NEXUS_PASS }}
      NEXUS_HOST: ${{ secrets.NEXUS_HOST }}
      NEXUS_REPO_FRONTEND: ${{ secrets.NEXUS_REPO_FRONTEND }}
      BACKEND_PORT: ${{ secrets.BACKEND_PORT }}
      FRONTEND_PORT: ${{ secrets.FRONTEND_PORT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure insecure registry
        run: |
          echo "{ \"insecure-registries\": [\"$NEXUS_HOST\"] }" | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
      - name: Ensure .env exists
        working-directory: src
        run: touch .env

      - name: Build frontend
        working-directory: src
        run: |
          chmod +x ./build-frontend.sh
          bash ./build-frontend.sh