name: build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend, frontend]
    
    env:
      NEXUS_USER: ${{ secrets.NEXUS_USER }}
      NEXUS_PASS: ${{ secrets.NEXUS_PASS }}
      NEXUS_HOST: ${{ secrets.NEXUS_HOST }}
      NEXUS_REPO_BACKEND: ${{ secrets.NEXUS_REPO_BACKEND }}
      NEXUS_REPO_FRONTEND: ${{ secrets.NEXUS_REPO_FRONTEND }}
      DOCKER_API_VERSION: "1.44"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run build script for ${{ matrix.component }}
        run: |
          touch .env  # На всякий случай создаем пустой .env
          chmod +x ./build-${{ matrix.component }}.sh
          ./build-${{ matrix.component }}.sh