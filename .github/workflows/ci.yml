name: CI/CD Pipeline

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:
    inputs:
      VERSION:
        description: "Версия для отката. Пусто — собрать новую."
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  # 1. ДЖОБА ВЕРСИИ
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Generate VERSION
        id: version
        run: |
          if [ -n "${{ github.event.inputs.VERSION }}" ]; then
            echo "version=${{ github.event.inputs.VERSION }}" >> $GITHUB_OUTPUT
          else
            echo "version=$(date -u +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT
          fi

  # 2. СБОРКА И ПУШ В ДВА РЕЕСТРА
  build:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend, frontend]
    env:
      REPO_NAME: ${{ matrix.component == 'backend' && secrets.NEXUS_REPO_BACKEND || secrets.NEXUS_REPO_FRONTEND }}
    steps:
      - uses: actions/checkout@v4

      # Настройка системного Docker (на всякий случай)
      - name: Configure Docker for insecure registry
        run: |
          echo "{ \"insecure-registries\": [\"${{ secrets.NEXUS_HOST }}\"] }" | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      # 👇 ВОТ ЗДЕСЬ ГЛАВНОЕ ИСПРАВЛЕНИЕ ДЛЯ BUILDX
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          config-inline: |
            [registry."${{ secrets.NEXUS_HOST }}"]
              http = true
              insecure = true

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Nexus
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.NEXUS_HOST }}
          username: ${{ secrets.NEXUS_USER }}
          password: ${{ secrets.NEXUS_PASS }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/sandbox-${{ matrix.component }}
            ${{ secrets.NEXUS_HOST }}/${{ env.REPO_NAME }}/sandbox-${{ matrix.component }}
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./src/${{ matrix.component }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 3. ДЕПЛОЙ
  deploy:
    needs: [version, build]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare .env
        run: |
          echo "NEXUS_HOST=${{ secrets.NEXUS_HOST }}" > .env
          echo "NEXUS_REPO_BACKEND=${{ secrets.NEXUS_REPO_BACKEND }}" >> .env
          echo "NEXUS_REPO_FRONTEND=${{ secrets.NEXUS_REPO_FRONTEND }}" >> .env
          echo "BACKEND_PORT=${{ secrets.BACKEND_PORT }}" >> .env
          echo "FRONTEND_PORT=${{ secrets.FRONTEND_PORT }}" >> .env
          echo "IMAGE_REGISTRY=${{ secrets.NEXUS_HOST }}" >> .env
          echo "IMAGE_TAG=${{ needs.version.outputs.version }}" >> .env

      - name: Copy files to VM
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "src/docker-compose.yml,.env"
          target: "~/app/"
          strip_components: 1

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ~/app
            
            # Логин в Nexus
            echo "${{ secrets.NEXUS_PASS }}" | docker login -u "${{ secrets.NEXUS_USER }}" --password-stdin "${{ secrets.NEXUS_HOST }}"
            
            # Скачиваем нужную версию и перезапускаем
            docker compose pull
            docker compose up -d --remove-orphans --force-recreate
            
            # Очистка старых образов
            docker image prune -f