apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-frontend
  namespace: sandbox
  labels:
    app: sandbox-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sandbox-frontend
  template:
    metadata:
      labels:
        app: sandbox-frontend
    spec:
      containers:
        - name: frontend
          image: "ghcr.io/naneerwn/sandbox-frontend:latest"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: sandbox-frontend
  namespace: sandbox
  labels:
    app: sandbox-frontend
spec:
  type: NodePort
  selector:
    app: sandbox-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
      nodePort: 30080